# team2-2 수집 스택: InfluxDB 2.7 + MQTT 수집기
# 실행: docker compose up -d --build
# 두 컨테이너 모두 restart 정책으로 보드 재부팅·장애 뒤 자동으로 다시 시작된다.
# 팀원 스택(포트 8086)과 이름·포트·볼륨이 겹치지 않게 했다.
name: t22-ingest

services:
  influxdb:
    image: influxdb:2.7
    container_name: t22-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8086"   # 보드 안에서만 연다
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  collector:
    build: ./collector
    container_name: t22-collector
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: .env
    environment:
      INFLUX_URL: http://influxdb:8086
      CONFIG: /app/config.yaml
    volumes:
      - ./collector/config.yaml:/app/config.yaml:ro
    logging: *logging

  # 과제 8: 추론 결과 브로커. 다른 팀·LLM 에이전트가 구독한다(읽기는 익명 허용, 쓰기는 서비스 계정만).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: t22-mosquitto
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    logging: *logging
